<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Makhzan — Your Inventory Under Control</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
      }
      .boot {
        box-sizing: border-box;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: #f9fafb;
        color: #111827;
        font-family: Inter, system-ui, sans-serif;
      }
      .boot-mark {
        width: 2rem;
        height: 2rem;
        border-radius: 0.5rem;
        background: #000;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.75rem;
        font-weight: 700;
      }
      .boot-card {
        margin-top: 1rem;
        font-size: 0.875rem;
        color: #4b5563;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <div class="boot-mark">MK</div>
        <div class="boot-card" id="boot-msg">Opening Makhzan…</div>
      </div>
    </div>
    <script type="module">
      import("/src/main.tsx").catch((err) => {
        const el = document.getElementById("boot-msg");
        if (el) el.textContent = err instanceof Error ? err.message : String(err);
      });
    </script>
  </body>
</html>
